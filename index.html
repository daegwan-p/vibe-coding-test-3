<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>할 일</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="필터 메뉴">
        <p class="sidebar-brand">할 일</p>
        <nav
          class="filters"
          id="filters"
          role="tablist"
          aria-label="할 일 필터"
        >
          <button
            type="button"
            class="filter-btn is-active"
            role="tab"
            data-filter="all"
            aria-selected="true"
          >
            <span class="filter-chip filter-chip-all" aria-hidden="true">
              <i data-lucide="inbox"></i>
            </span>
            <span class="filter-label">전체</span>
            <span class="filter-badge" id="badge-all">0</span>
          </button>
          <button
            type="button"
            class="filter-btn"
            role="tab"
            data-filter="today"
            aria-selected="false"
          >
            <span class="filter-chip filter-chip-today" aria-hidden="true">
              <i data-lucide="sun"></i>
            </span>
            <span class="filter-label">오늘</span>
            <span class="filter-badge" id="badge-today">0</span>
          </button>
          <button
            type="button"
            class="filter-btn"
            role="tab"
            data-filter="daily"
            aria-selected="false"
          >
            <span class="filter-chip filter-chip-daily" aria-hidden="true">
              <i data-lucide="repeat"></i>
            </span>
            <span class="filter-label">매일</span>
            <span class="filter-badge" id="badge-daily">0</span>
          </button>
          <button
            type="button"
            class="filter-btn"
            role="tab"
            data-filter="active"
            aria-selected="false"
          >
            <span class="filter-chip filter-chip-active" aria-hidden="true">
              <i data-lucide="circle"></i>
            </span>
            <span class="filter-label">진행중</span>
            <span class="filter-badge" id="badge-active">0</span>
          </button>
          <button
            type="button"
            class="filter-btn"
            role="tab"
            data-filter="done"
            aria-selected="false"
          >
            <span class="filter-chip filter-chip-done" aria-hidden="true">
              <i data-lucide="check-circle-2"></i>
            </span>
            <span class="filter-label">완료</span>
            <span class="filter-badge" id="badge-done">0</span>
          </button>
        </nav>
      </aside>

      <main class="app">
        <header class="header">
          <p class="brand">할 일</p>
          <p class="greeting" id="greeting">좋은 하루</p>
          <p class="date-line" id="date-line"></p>
        </header>

        <section class="overview" aria-label="오늘 요약">
          <div class="stats">
            <article class="stat-card">
              <p class="stat-label">전체</p>
              <p class="stat-value" id="stat-total">0</p>
            </article>
            <article class="stat-card">
              <p class="stat-label">진행중</p>
              <p class="stat-value" id="stat-active">0</p>
            </article>
            <article class="stat-card">
              <p class="stat-label">완료</p>
              <p class="stat-value" id="stat-done">0</p>
            </article>
          </div>

          <div class="progress-block">
            <div class="progress-meta">
              <span class="progress-label">진행률</span>
              <span class="progress-percent" id="progress-percent">0%</span>
            </div>
            <div
              class="progress-track"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              id="progress-bar"
            >
              <div class="progress-fill" id="progress-fill"></div>
            </div>
          </div>
        </section>

        <form class="add-form" id="add-form" autocomplete="off">
          <label class="sr-only" for="todo-input">새 할 일</label>
          <input
            type="text"
            id="todo-input"
            name="todo"
            placeholder="무엇을 할까요?"
            maxlength="120"
            required
          />
          <div class="type-toggle" role="group" aria-label="할 일 종류">
            <label class="type-option">
              <input type="radio" name="todo-type" value="once" checked />
              <span>하루</span>
            </label>
            <label class="type-option">
              <input type="radio" name="todo-type" value="daily" />
              <span>매일</span>
            </label>
          </div>
          <button type="submit" class="btn btn-primary" id="add-btn">
            <i data-lucide="plus" aria-hidden="true"></i>
            <span>추가</span>
          </button>
        </form>

        <section class="list-section" id="list-section" aria-labelledby="list-heading">
          <div class="list-toolbar">
            <div class="list-meta">
              <h2 id="list-heading">목록</h2>
              <p class="count" id="todo-count">0개</p>
            </div>

            <button type="button" class="btn btn-clear" id="clear-done" hidden>
              <i data-lucide="trash-2" aria-hidden="true"></i>
              <span>오늘 완료 정리</span>
            </button>
          </div>

          <p class="status" id="status" role="status" aria-live="polite">
            불러오는 중…
          </p>

          <ul class="todo-list" id="todo-list" hidden></ul>

          <div class="done-section" id="done-section" hidden>
            <button
              type="button"
              class="done-toggle"
              id="done-toggle"
              aria-expanded="false"
              aria-controls="done-list"
            >
              <span class="done-toggle-label">
                완료 <span id="done-section-count">0</span>개
              </span>
              <span class="done-chevron" aria-hidden="true">▸</span>
            </button>
            <ul class="todo-list done-list" id="done-list" hidden></ul>
          </div>

          <div class="empty" id="empty-state" hidden>
            <i data-lucide="inbox" class="empty-icon" aria-hidden="true"></i>
            <p class="empty-title" id="empty-title">할 일이 없습니다</p>
            <p class="empty-desc" id="empty-desc">
              위에서 새 할 일을 추가해 보세요
            </p>
          </div>

          <div class="error-panel" id="error-panel" hidden>
            <p id="error-message">할 일 목록을 불러오지 못했습니다.</p>
            <button type="button" class="btn btn-primary" id="retry-btn">
              <i data-lucide="refresh-cw" aria-hidden="true"></i>
              <span>다시 시도</span>
            </button>
          </div>
        </section>
      </main>
    </div>

    <button type="button" class="fab" id="fab-add" aria-label="할 일 추가">
      <i data-lucide="plus" aria-hidden="true"></i>
    </button>

    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
